<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Blue arrow: top left to bottom right -->
  <g transform="translate(10, 10)">
    <line x1="0" y1="0" x2="30" y2="30" stroke="#3B82F6" stroke-width="8" stroke-linecap="round"/>
    <polygon points="20,38 44,44 38,20" fill="#3B82F6"/>
  </g>
  
  <!-- Red arrow: top to center -->
  <g transform="translate(32, 4)">
    <line x1="0" y1="0" x2="0" y2="18" stroke="#EF4444" stroke-width="8" stroke-linecap="round"/>
    <polygon points="-12,14 0,34 12,14" fill="#EF4444"/>
  </g>
</svg>
